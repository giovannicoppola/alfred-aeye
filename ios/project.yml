name: Aeye
options:
  bundleIdPrefix: com.giovanni
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: VDG762YNX9
    CODE_SIGN_STYLE: Automatic
targets:
  Aeye:
    type: application
    platform: iOS
    sources:
      - path: Aeye
      - path: Shared
      - path: Assets.xcassets
      - path: Config/PrivacyInfo.xcprivacy
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.giovanni.aeye
      INFOPLIST_FILE: Aeye/Info.plist
      CODE_SIGN_ENTITLEMENTS: Config/Aeye.entitlements
      INFOPLIST_KEY_CFBundleDisplayName: Aeye
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: AeyeWidgetExtension
        embed: true
      - target: AeyeWatch
        embed: true
  AeyeWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: AeyeWidget
      - path: Shared
        excludes:
          - WatchBridge.swift
          - CursorClient.swift
          - CursorAuth.swift
          - ClaudeClient.swift
          - ClaudeOAuth.swift
          - KeychainStore.swift
          - AeyeService.swift
      - path: Config/PrivacyInfo.xcprivacy
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.giovanni.aeye.widget
      INFOPLIST_FILE: Config/AeyeWidget-Info.plist
      CODE_SIGN_ENTITLEMENTS: Config/AeyeWidget.entitlements
      INFOPLIST_KEY_CFBundleDisplayName: Aeye Widget
      TARGETED_DEVICE_FAMILY: "1"
      SKIP_INSTALL: YES
  AeyeWatch:
    type: application
    platform: watchOS
    sources:
      - path: AeyeWatch
      - path: Shared
        excludes:
          - CursorClient.swift
          - CursorAuth.swift
          - ClaudeClient.swift
          - ClaudeOAuth.swift
          - KeychainStore.swift
          - AeyeService.swift
      - path: Assets.xcassets
      - path: Config/PrivacyInfo.xcprivacy
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.giovanni.aeye.watchkitapp
      INFOPLIST_FILE: AeyeWatch/Info.plist
      CODE_SIGN_ENTITLEMENTS: Config/AeyeWatch.entitlements
      INFOPLIST_KEY_CFBundleDisplayName: Aeye
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      SKIP_INSTALL: YES
    dependencies:
      - target: AeyeWatchWidgets
        embed: true
  AeyeWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: AeyeWatchWidgets
      - path: Shared
        excludes:
          - CursorClient.swift
          - CursorAuth.swift
          - ClaudeClient.swift
          - ClaudeOAuth.swift
          - KeychainStore.swift
          - AeyeService.swift
          - WatchBridge.swift
      - path: Config/PrivacyInfo.xcprivacy
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.giovanni.aeye.watchkitapp.widgets
      INFOPLIST_FILE: Config/AeyeWatchWidgets-Info.plist
      CODE_SIGN_ENTITLEMENTS: Config/AeyeWatchWidgets.entitlements
      INFOPLIST_KEY_CFBundleDisplayName: Aeye
      SKIP_INSTALL: YES
schemes:
  Aeye:
    build:
      targets:
        Aeye: all
        AeyeWidgetExtension: all
        AeyeWatch: all
        AeyeWatchWidgets: all
    run:
      config: Debug
